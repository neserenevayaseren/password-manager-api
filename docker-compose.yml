version: "3.8"

services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/password-manager
      - JWT_SECRET=super_secret_key_lab7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  frontend:
    build: ./password-manager-client
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
